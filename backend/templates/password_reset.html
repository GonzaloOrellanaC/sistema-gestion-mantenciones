<!-- DEFAULT_LOGO_PATH: /assets/sgm-logo.svg (frontend/public/assets/sgm-logo.svg) -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Restablecer contraseña</title>
  </head>
  <body style="margin:0;background-color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#4A5568;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center" style="padding:28px 12px;">
          <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="background:#FFFFFF;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(137,194,217,0.12);">
            <tr>
              <td style="padding:24px 28px;text-align:center;">
                <img src="{{logoUrl}}" alt="SGM" width="120" style="display:block;margin:0 auto 8px auto;object-fit:contain;" />
                <h2 style="margin:6px 0 6px 0;font-size:18px;color:#0b5cff;">Restablecer contraseña</h2>
                <p style="margin:0;color:#4A5568;">Has solicitado restablecer tu contraseña. Haz clic en el botón para crear una nueva contraseña. Este enlace expirará en el tiempo configurado por el sistema.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 32px 28px;text-align:center;">
                <a href="{{resetLink}}" style="display:inline-block;margin-top:18px;padding:12px 24px;border-radius:12px;background:#89C2D9;color:#ffffff;font-weight:700;text-decoration:none;">Restablecer mi contraseña</a>
                <p style="margin-top:18px;font-size:13px;color:#667085;">Si no solicitaste esto, ignora este correo.</p>
              </td>
            </tr>
            <tr>
              <td style="background:#F8FAFC;padding:16px 28px;text-align:center;font-size:12px;color:#94A3B8;">
                Enlace alternativo: <a href="{{resetLink}}" style="color:#4A5568;word-break:break-all;">{{resetLink}}</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
